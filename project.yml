name: Cinnamon
options:
  bundleIdPrefix: app.cinnamon
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: vi

packages:
  CinnamonCore:
    path: CinnamonCore

targets:
  Cinnamon:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: CinnamonCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Cinnamon
        CFBundleDevelopmentRegion: vi
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "Cinnamon dùng máy ảnh để chụp hộp thuốc và đọc tên thuốc ngay trên điện thoại."
        NSPhotoLibraryUsageDescription: "Cinnamon dùng ảnh để đọc tên thuốc ngay trên điện thoại."
        # Optional: a free AirNow API key (https://docs.airnowapi.org). Leave empty to use Open-Meteo only.
        AirNowAPIKey: ""
        UIAppFonts: []
    entitlements:
      path: App/Cinnamon.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cinnamon.ios
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
